# Deploy everything with: kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netinventory
resources:
  - namespace.yaml
  - config.yaml
  - db.yaml
  - site-service.yaml
  - equipment-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - network-policies.yaml
# Docker Hub images (mahtoyy). Change the tag here for a new version.
images:
  - { name: netinventory-db, newName: docker.io/mahtoyy/netinventory-db, newTag: "1.0" }
  - { name: site-service, newName: docker.io/mahtoyy/site-service, newTag: "1.0" }
  - { name: equipment-service, newName: docker.io/mahtoyy/equipment-service, newTag: "1.0" }
  - { name: api-gateway, newName: docker.io/mahtoyy/api-gateway, newTag: "1.0" }
  - { name: frontend, newName: docker.io/mahtoyy/frontend, newTag: "1.0" }

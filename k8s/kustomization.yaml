# Deploy everything with: kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netinventory
resources:
  - namespace.yaml
  - config.yaml
  - db.yaml
  - site-service.yaml
  - equipment-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - network-policies.yaml
# Docker Hub images: set your username here.
images:
  - { name: netinventory-db, newName: docker.io/DOCKERHUB_USER/netinventory-db, newTag: "1.0" }
  - { name: site-service, newName: docker.io/DOCKERHUB_USER/site-service, newTag: "1.0" }
  - { name: equipment-service, newName: docker.io/DOCKERHUB_USER/equipment-service, newTag: "1.0" }
  - { name: api-gateway, newName: docker.io/DOCKERHUB_USER/api-gateway, newTag: "1.0" }
  - { name: frontend, newName: docker.io/DOCKERHUB_USER/frontend, newTag: "1.0" }

spring:
  application.name: site-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  http.clients:
    connect-timeout: 2s
    read-timeout: 3s
equipment-service.url: ${EQUIPMENT_SERVICE_URL}
management:
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db

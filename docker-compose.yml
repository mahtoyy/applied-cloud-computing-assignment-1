services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/db/init.sh"]
    volumes:
      - ./db:/db:ro
    environment:
      DB_HOST: db
      SA_PASSWORD: ${SA_PASSWORD}
      SITE_DB_PASSWORD: ${SITE_DB_PASSWORD}
      EQUIPMENT_DB_PASSWORD: ${EQUIPMENT_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  site-service:
    build: ./site-service
    image: site-service:dev
    environment:
      DB_URL: jdbc:sqlserver://db:1433;databaseName=sitedb;encrypt=true;trustServerCertificate=true
      DB_USERNAME: site_user
      DB_PASSWORD: ${SITE_DB_PASSWORD}
      EQUIPMENT_SERVICE_URL: http://equipment-service:8080
    depends_on:
      db-init:
        condition: service_completed_successfully

  equipment-service:
    build: ./equipment-service
    image: equipment-service:dev
    environment:
      DB_URL: jdbc:sqlserver://db:1433;databaseName=equipmentdb;encrypt=true;trustServerCertificate=true
      DB_USERNAME: equipment_user
      DB_PASSWORD: ${EQUIPMENT_DB_PASSWORD}
      SITE_SERVICE_URL: http://site-service:8080
    depends_on:
      db-init:
        condition: service_completed_successfully

  api-gateway:
    build: ./api-gateway
    image: api-gateway:dev
    environment:
      SITE_SERVICE_URL: http://site-service:8080
      EQUIPMENT_SERVICE_URL: http://equipment-service:8080
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    image: frontend:dev
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports:
      - "8080:8080"

volumes:
  mssql-data:
